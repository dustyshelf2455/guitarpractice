<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Timebox</title>
  <meta name="description" content="Timeboxed guitar practice: twelve 5-minute blocks a day, with ratings and stats.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Timebox">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply a saved light/dark choice before first paint (the real setting lives in IndexedDB).
    try {
      var t = localStorage.getItem('timebox-theme');
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app" class="app"></div>
  <noscript><p style="padding:24px">Timebox needs JavaScript to run.</p></noscript>
</body>
</html>
